# 로컬 개발용 PostgreSQL.
#   docker compose up -d      (또는 podman compose up -d)
# 호스트 5432 는 다른 용도로 점유되는 경우가 많아 5433 으로 노출한다.
version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: demo-postgres
    environment:
      POSTGRES_DB: demodb
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo1234
      TZ: Asia/Seoul
      # 한글 정렬/비교를 위한 초기화 옵션
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demodb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  demo-pgdata:
